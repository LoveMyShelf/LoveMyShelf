ShortDescription: Browse big, unsorted folders of photos, GIFs and videos as a grid, and give each file a 9:16 cover you pick.
Description: |-
  Love My Shelf is a free, open-source Windows gallery that you use like File Explorer.
  It shows photos, animated GIF/WebP and videos as large tiles, and lets you save a scene you choose as a 9:16 cover (JPG, or animated GIF/WebP/MP4).
  Making covers never changes the original files; covers are saved separately and follow their file when you move, rename or copy it inside the app.
  Everything runs on your PC. The only network use is checking GitHub for updates (can be turned off) and downloading one when you click update.
